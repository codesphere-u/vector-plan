[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "vector-plan"
version = "0.1.0"
description = "Zero-dependency WHO malaria vector-control microplanner: ITN/LLIN pop/1.8 campaign & NetCALC attrition curves, IRS insecticide sachet/pump-charge & resistance rotation guard, and SMC SPAQ quantification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "malaria",
    "vector-control",
    "who",
    "llin",
    "irs",
    "public-health",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
vector-plan = "vector_plan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_plan"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
